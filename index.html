<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08252F">
<title>Ar em Dia</title>
<link rel="manifest" id="lkManifest">
<link rel="apple-touch-icon" id="lkApple">
<link rel="icon" id="lkFav">
<style>
:root{
  --ink:#08252F; --teal:#0B6E75; --teal-2:#0E8891; --copper:#A85B2A;
  --red:#B3322F; --green:#2F7D4F;
  --bg:#EEF4F5; --surface:#FFFFFF; --line:#C9D9DC; --text:#0B2A33; --muted:#5C7880;
  --tap:54px;
}
:root[data-tema="escuro"]{
  --bg:#08252F; --surface:#0E323E; --line:#1D4652; --text:#E4EFF1; --muted:#8CA9B1;
  --teal:#3FA9B0; --teal-2:#55BEC4; --copper:#D08247; --red:#E0625E; --green:#57B37C;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  font-size:17px; line-height:1.45;
  font-variant-numeric:tabular-nums;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.02em;line-height:1.15}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--teal)}

/* topo */
.topo{
  position:sticky;top:0;z-index:40;background:var(--ink);color:#E4EFF1;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  display:flex;align-items:center;gap:10px;
}
.topo h1{font-size:19px;flex:1;color:#fff}
#logo{border-radius:7px;display:block;background:#fff}
.ver{font-size:12px;font-weight:600;color:#7FB4BB;letter-spacing:.01em}
.tema{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:19px;background:rgba(255,255,255,.1)}

/* conteúdo */
main{padding:18px 16px 24px;max-width:640px;margin:0 auto}
.cabeca{margin-bottom:16px}
.cabeca h2{font-size:24px}
.cabeca p{margin:4px 0 0;color:var(--muted);font-size:15px}

/* linhas com barra de estado (aletas) */
.linha{
  display:block;width:100%;text-align:left;background:var(--surface);
  border:1px solid var(--line);border-left:5px solid var(--teal);
  border-radius:3px;padding:13px 14px;margin-bottom:9px;
}
.linha.vencida{border-left-color:var(--red)}
.linha.vencendo{border-left-color:var(--copper)}
.linha.ok{border-left-color:var(--green)}
.linha.neutra{border-left-color:var(--line)}
.linha .est{font-size:13px;font-weight:700;letter-spacing:.01em}
.linha.vencida .est{color:var(--red)}
.linha.vencendo .est{color:var(--copper)}
.linha.ok .est{color:var(--green)}
.linha .tit{font-size:17px;font-weight:700;margin-top:2px}
.linha .sub{font-size:14px;color:var(--muted);margin-top:2px}
.linha .val{float:right;font-weight:800}

.grupo{margin:26px 0 10px;font-size:14px;font-weight:700;color:var(--muted)}
.grupo:first-child{margin-top:0}

.vazio{
  border:1px dashed var(--line);border-radius:4px;padding:22px 18px;
  color:var(--muted);font-size:15px;background:var(--surface)
}
.vazio strong{display:block;color:var(--text);font-size:16px;margin-bottom:5px}

/* botões */
.btn{
  display:block;width:100%;min-height:var(--tap);border-radius:4px;
  background:var(--teal);color:#fff;font-weight:700;font-size:17px;
  padding:14px;text-align:center;margin-top:12px;
}
.btn.sec{background:transparent;color:var(--teal);border:1.5px solid var(--teal)}
.btn.cobre{background:var(--copper)}
.btn.perigo{background:transparent;color:var(--red);border:1.5px solid var(--red)}
.btn.mini{min-height:44px;font-size:15px;padding:10px;margin-top:8px}
.dupla{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.dupla .btn{margin-top:0}

/* busca */
.busca{
  width:100%;min-height:var(--tap);background:var(--surface);
  border:1px solid var(--line);border-radius:4px;padding:13px 14px;margin-bottom:14px;
}

/* formulário */
.campo{margin-bottom:13px}
.campo label{display:block;font-size:14px;font-weight:600;color:var(--muted);margin-bottom:5px}
.campo input,.campo select,.campo textarea{
  width:100%;min-height:var(--tap);background:var(--surface);
  border:1px solid var(--line);border-radius:4px;padding:13px 14px;
}
.campo textarea{min-height:88px;resize:vertical}
.campo input:focus,.campo select:focus,.campo textarea:focus,.busca:focus{
  outline:2px solid var(--teal-2);outline-offset:1px;border-color:var(--teal-2)
}
.lado{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.dica{font-size:13px;color:var(--muted);margin:-7px 0 13px}

/* folha modal */
.folha{position:fixed;inset:0;z-index:60;display:none}
.folha.on{display:block}
.folha .fundo{position:absolute;inset:0;background:rgba(4,20,26,.55)}
.folha .painel{
  position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow-y:auto;
  background:var(--bg);border-radius:14px 14px 0 0;
  padding:20px 16px calc(28px + env(safe-area-inset-bottom));
}
.folha .painel{max-width:640px;margin:0 auto}
.folha h3{font-size:21px;margin-bottom:16px}
.puxador{width:40px;height:4px;border-radius:2px;background:var(--line);margin:-8px auto 14px}

/* ficha */
.ficha{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:15px;margin-bottom:14px}
.ficha .nome{font-size:22px;font-weight:800}
.ficha .dado{font-size:15px;color:var(--muted);margin-top:3px}
.total{
  display:flex;justify-content:space-between;align-items:baseline;
  border-top:2px solid var(--ink);margin-top:14px;padding-top:12px;font-weight:800;font-size:21px
}
:root[data-tema="escuro"] .total{border-top-color:var(--teal)}

/* item de orçamento */
.item{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.item .n{flex:1;font-size:15px}
.item .p{font-weight:700;white-space:nowrap}
.qtd{display:flex;align-items:center;gap:0}
.qtd button{width:40px;height:40px;border:1px solid var(--line);background:var(--surface);font-size:19px;font-weight:700}
.qtd span{width:38px;text-align:center;font-weight:700}

/* navegação inferior */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);
  border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);
  padding-bottom:env(safe-area-inset-bottom);
}
nav button{padding:9px 2px 8px;color:var(--muted);font-size:11px;font-weight:600;display:grid;gap:3px;justify-items:center}
nav button.on{color:var(--teal)}
nav svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.sino{position:absolute;top:6px;margin-left:19px;background:var(--red);color:#fff;font-size:10px;font-weight:800;border-radius:9px;padding:1px 5px}

/* aviso */
.aviso{background:var(--surface);border:1px solid var(--copper);border-left:5px solid var(--copper);border-radius:3px;padding:13px 14px;margin-bottom:16px;font-size:15px}

#toast{
  position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(14px);
  background:var(--ink);color:#fff;padding:12px 18px;border-radius:4px;font-size:15px;font-weight:600;
  z-index:80;opacity:0;pointer-events:none;transition:.18s;max-width:88vw;text-align:center
}
#toast.on{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

</style>
</head>
<body>

<div class="topo">
  <img id="logo" alt="" width="30" height="30">
  <h1>Ar em Dia</h1>
  <span class="ver" id="verLabel">v1.1.0</span>
  <button class="tema" id="btnTema" aria-label="Alternar tema">☾</button>
</div>

<main id="tela"></main>

<nav id="nav"></nav>

<div class="folha" id="folha">
  <div class="fundo" data-fechar></div>
  <div class="painel"><div class="puxador"></div><div id="folhaConteudo"></div></div>
</div>

<div id="toast"></div>
<input type="file" id="arqImport" accept="application/json,.json" style="display:none">

<script>
const VERSAO = "1.1.0";
const CHAVE = "aremdia_v1";

/* ---------- dados ---------- */
const PADRAO = {
  versao: VERSAO,
  clientes: [], equipamentos: [], orcamentos: [], agendamentos: [], historico: [],
  servicos: [
    {id:"s1", nome:"Instalação split 9.000 BTU", preco:450, dur:180},
    {id:"s2", nome:"Instalação split 12.000 BTU", preco:520, dur:180},
    {id:"s3", nome:"Instalação split 18.000 BTU", preco:650, dur:210},
    {id:"s4", nome:"Instalação split 24.000 BTU", preco:800, dur:240},
    {id:"s5", nome:"Limpeza e higienização", preco:180, dur:60},
    {id:"s6", nome:"Carga de gás", preco:250, dur:60},
    {id:"s7", nome:"Desinstalação", preco:200, dur:90},
    {id:"s8", nome:"Metro de tubulação de cobre", preco:90, dur:0},
    {id:"s9", nome:"Suporte para condensadora", preco:120, dur:0},
    {id:"s10", nome:"Furo em parede ou laje", preco:80, dur:0},
    {id:"s11", nome:"Visita técnica e diagnóstico", preco:80, dur:30}
  ],
  config:{ intervaloPadrao:6, garantiaDias:90, empresa:"", telefone:"", tema:"claro" }
};

let db = carregar();

function carregar(){
  try{
    const bruto = localStorage.getItem(CHAVE);
    if(!bruto) return JSON.parse(JSON.stringify(PADRAO));
    const d = JSON.parse(bruto);
    for(const k in PADRAO) if(!(k in d)) d[k] = JSON.parse(JSON.stringify(PADRAO[k]));
    for(const k in PADRAO.config) if(!(k in d.config)) d.config[k] = PADRAO.config[k];
    return d;
  }catch(e){ return JSON.parse(JSON.stringify(PADRAO)); }
}
function salvar(){
  db.versao = VERSAO;
  try{ localStorage.setItem(CHAVE, JSON.stringify(db)); }
  catch(e){ toast("Não consegui salvar. Memória do aparelho cheia."); }
}

/* ---------- utilidades ---------- */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const brl = n => (Number(n)||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
function toISO(dt){ return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0"); }
const hojeISO = () => toISO(new Date());
function somaMeses(iso, n){ const [y,m,d]=iso.split("-").map(Number); return toISO(new Date(y, m-1+Number(n), d)); }
function somaDias(iso, n){ const [y,m,d]=iso.split("-").map(Number); return toISO(new Date(y, m-1, d+Number(n))); }
function dias(iso){ if(!iso) return null; return Math.round((new Date(iso+"T00:00:00") - new Date(hojeISO()+"T00:00:00"))/86400000); }
function fmt(iso){ if(!iso) return "—"; const [y,m,d]=iso.split("-"); return d+"/"+m+"/"+y; }
function fmtLongo(iso){
  const meses=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
  const [y,m,d]=iso.split("-").map(Number); return d+" de "+meses[m-1];
}
function zap(tel, texto){
  let n = String(tel||"").replace(/\D/g,"");
  if(n.length===10||n.length===11) n = "55"+n;
  return "https://wa.me/"+n+"?text="+encodeURIComponent(texto);
}
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("on");
  clearTimeout(t._id); t._id = setTimeout(()=>t.classList.remove("on"), 2600);
}
const cliente = id => db.clientes.find(c=>c.id===id);
const equip = id => db.equipamentos.find(e=>e.id===id);

/* ---------- tema ---------- */
function aplicarTema(){
  document.documentElement.dataset.tema = db.config.tema;
  document.getElementById("btnTema").textContent = db.config.tema==="escuro" ? "☀" : "☾";
  document.querySelector('meta[name=theme-color]').content = db.config.tema==="escuro" ? "#08252F" : "#08252F";
}
document.getElementById("btnTema").onclick = () => {
  db.config.tema = db.config.tema==="escuro" ? "claro" : "escuro";
  salvar(); aplicarTema();
};

/* ---------- navegação ---------- */
let vista = "hoje", parametro = null;
const ICONES = {
  hoje:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',
  clientes:'<circle cx="9" cy="8" r="3.4"/><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/><path d="M17 11.5a2.6 2.6 0 100-5.2"/><path d="M18 19.8c0-2.4-1-4-2.4-4.9"/>',
  orcar:'<path d="M7 3h10a1 1 0 011 1v16l-6-3-6 3V4a1 1 0 011-1z"/><path d="M9 9h6M9 13h4"/>',
  agenda:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  ajustes:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/>'
};
const ABAS = [["hoje","Hoje"],["clientes","Clientes"],["orcar","Orçamentos"],["agenda","Agenda"],["ajustes","Ajustes"]];

function nav(v, p){ vista=v; parametro=p??null; window.scrollTo(0,0); render(); }

function renderNav(){
  const pend = pendencias().vencidas.length;
  document.getElementById("nav").innerHTML = ABAS.map(([k,r])=>`
    <button data-aba="${k}" class="${vista===k||(k==='clientes'&&vista==='cliente')||(k==='orcar'&&vista==='orcamento')?'on':''}">
      <span style="position:relative;display:block">
        <svg viewBox="0 0 24 24">${ICONES[k]}</svg>
        ${k==="hoje"&&pend?`<span class="sino">${pend}</span>`:""}
      </span>${r}
    </button>`).join("");
}

/* ---------- pendências ---------- */
function pendencias(){
  const vencidas=[], proximas=[];
  db.equipamentos.forEach(e=>{
    if(!e.proxima) return;
    const d = dias(e.proxima);
    if(d < 0) vencidas.push({e,d}); else if(d <= 30) proximas.push({e,d});
  });
  vencidas.sort((a,b)=>a.d-b.d); proximas.sort((a,b)=>a.d-b.d);
  return {vencidas, proximas};
}

/* ---------- render ---------- */
function render(){
  document.getElementById("verLabel").textContent = "v"+VERSAO;
  const t = document.getElementById("tela");
  const mapa = {hoje:vHoje, clientes:vClientes, cliente:vCliente, orcar:vOrcamentos,
                orcamento:vOrcamento, agenda:vAgenda, ajustes:vAjustes};
  t.innerHTML = (mapa[vista]||vHoje)();
  renderNav();
}

/* ===== HOJE ===== */
function vHoje(){
  const {vencidas, proximas} = pendencias();
  const hoje = hojeISO();
  const doDia = db.agendamentos.filter(a=>a.data===hoje && a.status!=="cancelado")
                               .sort((a,b)=>(a.hora||"").localeCompare(b.hora||""));
  const semana = db.agendamentos.filter(a=>a.data>hoje && a.data<=somaDias(hoje,7) && a.status!=="cancelado")
                               .sort((a,b)=>(a.data+a.hora).localeCompare(b.data+b.hora));

  let h = `<div class="cabeca"><h2>Hoje, ${fmtLongo(hoje)}</h2>
    <p>${db.clientes.length} ${db.clientes.length===1?"cliente":"clientes"} · ${db.equipamentos.length} ${db.equipamentos.length===1?"aparelho":"aparelhos"}</p></div>`;

  if(!db.clientes.length){
    h += `<div class="vazio"><strong>Comece pela carteira antiga</strong>
      Cadastre os clientes que você já instalou, mesmo sem lembrar tudo. Só o nome e o telefone já bastam.
      Assim que a data de instalação entrar, o app mostra quem já está com a manutenção vencida.</div>
      <button class="btn" data-ir="clientes">Cadastrar o primeiro cliente</button>`;
    return h;
  }

  if(vencidas.length){
    h += `<div class="grupo">Manutenção vencida</div>`;
    h += vencidas.map(({e,d})=>linhaManut(e, d, "vencida")).join("");
  }
  if(proximas.length){
    h += `<div class="grupo">Vence nos próximos 30 dias</div>`;
    h += proximas.map(({e,d})=>linhaManut(e, d, "vencendo")).join("");
  }
  h += `<div class="grupo">Agenda de hoje</div>`;
  h += doDia.length ? doDia.map(a=>linhaAgenda(a)).join("")
    : `<div class="vazio">Nenhum serviço marcado para hoje.</div>`;

  if(semana.length){
    h += `<div class="grupo">Próximos sete dias</div>` + semana.map(a=>linhaAgenda(a,true)).join("");
  }
  if(!vencidas.length && !proximas.length){
    h += `<div class="grupo">Manutenções</div><div class="vazio">Nada vencendo nos próximos 30 dias.</div>`;
  }
  return h;
}

function linhaManut(e, d, classe){
  const c = cliente(e.clienteId); if(!c) return "";
  const est = d<0 ? `Vencida há ${Math.abs(d)} ${Math.abs(d)===1?"dia":"dias"}`
                  : d===0 ? "Vence hoje" : `Vence em ${d} ${d===1?"dia":"dias"}`;
  return `<button class="linha ${classe}" data-manut="${e.id}">
    <div class="est">${est}</div>
    <div class="tit">${esc(c.nome)}</div>
    <div class="sub">${esc(e.local||"Aparelho")}${e.btu?" · "+esc(e.btu)+" BTU":""} · última em ${fmt(e.ultima)}</div>
  </button>`;
}
function linhaAgenda(a, comData){
  const c = cliente(a.clienteId);
  return `<button class="linha" data-agend="${a.id}">
    <div class="est">${comData?fmt(a.data)+" · ":""}${esc(a.hora||"sem hora")}</div>
    <div class="tit">${esc(a.tipo||"Serviço")}</div>
    <div class="sub">${esc(c?c.nome:"Cliente removido")}${a.local?" · "+esc(a.local):""}</div>
  </button>`;
}

/* ===== CLIENTES ===== */
let buscaTxt = "";
function vClientes(){
  const q = buscaTxt.toLowerCase().trim();
  const lista = db.clientes.filter(c =>
    !q || c.nome.toLowerCase().includes(q) || String(c.telefone||"").replace(/\D/g,"").includes(q.replace(/\D/g,""))
  ).sort((a,b)=>a.nome.localeCompare(b.nome,"pt-BR"));

  let h = `<div class="cabeca"><h2>Clientes</h2><p>${db.clientes.length} cadastrados</p></div>
    <input class="busca" id="inpBusca" placeholder="Buscar por nome ou telefone" value="${esc(buscaTxt)}">
    <button class="btn" data-novo-cliente>Novo cliente</button>`;

  if(!lista.length){
    h += `<div class="vazio" style="margin-top:14px">${q?"Nenhum cliente com esse nome ou telefone.":"<strong>Nenhum cliente ainda</strong>Toque em Novo cliente. Só o nome e o telefone são obrigatórios."}</div>`;
    return h;
  }
  h += `<div class="grupo">Todos</div>` + lista.map(c=>{
    const eqs = db.equipamentos.filter(e=>e.clienteId===c.id);
    const pior = eqs.map(e=>dias(e.proxima)).filter(v=>v!==null).sort((a,b)=>a-b)[0];
    const classe = pior===undefined ? "neutra" : pior<0 ? "vencida" : pior<=30 ? "vencendo" : "ok";
    return `<button class="linha ${classe}" data-cliente="${c.id}">
      <div class="tit">${esc(c.nome)}</div>
      <div class="sub">${esc(c.telefone||"sem telefone")} · ${eqs.length} ${eqs.length===1?"aparelho":"aparelhos"}</div>
    </button>`;
  }).join("");
  return h;
}

/* ===== FICHA DO CLIENTE ===== */
function vCliente(){
  const c = cliente(parametro);
  if(!c){ vista="clientes"; return vClientes(); }
  const eqs = db.equipamentos.filter(e=>e.clienteId===c.id);
  const hist = db.historico.filter(x=>x.clienteId===c.id).sort((a,b)=>b.data.localeCompare(a.data));
  const orcs = db.orcamentos.filter(o=>o.clienteId===c.id).sort((a,b)=>b.criado.localeCompare(a.criado));

  let h = `<button class="btn sec mini" style="margin:0 0 14px" data-ir="clientes">Voltar</button>
  <div class="ficha">
    <div class="nome">${esc(c.nome)}</div>
    ${c.telefone?`<div class="dado">${esc(c.telefone)}</div>`:""}
    ${c.endereco?`<div class="dado">${esc(c.endereco)}</div>`:""}
    ${c.referencia?`<div class="dado">${esc(c.referencia)}</div>`:""}
    ${c.indicado?`<div class="dado">Indicado por ${esc(c.indicado)}</div>`:""}
    ${c.obs?`<div class="dado" style="margin-top:8px">${esc(c.obs)}</div>`:""}
    <div class="dupla" style="margin-top:14px">
      ${c.telefone?`<a class="btn mini" style="margin:0;text-decoration:none" href="${zap(c.telefone,"Olá "+c.nome+"!")}" target="_blank">WhatsApp</a>`:`<span></span>`}
      <button class="btn sec mini" style="margin:0" data-edit-cliente="${c.id}">Editar</button>
    </div>
    ${c.endereco?`<a class="btn sec mini" style="text-decoration:none" target="_blank" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(c.endereco)}">Abrir no mapa</a>`:""}
  </div>

  <div class="grupo">Aparelhos</div>`;

  h += eqs.length ? eqs.map(e=>{
    const d = dias(e.proxima);
    const classe = d===null?"neutra":d<0?"vencida":d<=30?"vencendo":"ok";
    const est = d===null?"Sem data de manutenção":d<0?`Manutenção vencida há ${Math.abs(d)} dias`:d===0?"Manutenção vence hoje":`Próxima manutenção em ${d} dias`;
    const garantia = e.garantiaAte && dias(e.garantiaAte)>=0 ? ` · na garantia até ${fmt(e.garantiaAte)}` : "";
    return `<button class="linha ${classe}" data-equip="${e.id}">
      <div class="est">${est}</div>
      <div class="tit">${esc(e.local||"Aparelho")}</div>
      <div class="sub">${[e.marca,e.modelo,e.btu?e.btu+" BTU":""].filter(Boolean).map(esc).join(" · ")||"sem detalhes"}</div>
      <div class="sub">Instalado em ${fmt(e.instalacao)} · a cada ${e.intervalo} meses${garantia}</div>
    </button>`;
  }).join("") : `<div class="vazio">Nenhum aparelho. Cadastre para o app controlar a manutenção.</div>`;

  h += `<button class="btn sec" data-novo-equip="${c.id}">Adicionar aparelho</button>`;

  if(orcs.length){
    h += `<div class="grupo">Orçamentos</div>` + orcs.slice(0,5).map(o=>`
      <button class="linha neutra" data-orc="${o.id}">
        <span class="val">${brl(totalOrc(o))}</span>
        <div class="est">${esc(o.status)}</div>
        <div class="tit">${fmt(o.criado)}</div>
      </button>`).join("");
  }
  if(hist.length){
    h += `<div class="grupo">Histórico</div>` + hist.slice(0,10).map(x=>`
      <div class="linha neutra"><div class="est">${fmt(x.data)}</div>
      <div class="tit">${esc(x.tipo)}</div>${x.obs?`<div class="sub">${esc(x.obs)}</div>`:""}</div>`).join("");
  }
  h += `<button class="btn perigo" data-apagar-cliente="${c.id}">Apagar cliente</button>`;
  return h;
}

/* ===== ORÇAMENTOS ===== */
const totalOrc = o => o.itens.reduce((s,i)=>s+i.preco*i.qtd,0) - (o.desconto||0);

function vOrcamentos(){
  const lista = [...db.orcamentos].sort((a,b)=>b.criado.localeCompare(a.criado));
  let h = `<div class="cabeca"><h2>Orçamentos</h2><p>${lista.length} no total</p></div>
    <button class="btn" data-novo-orc>Novo orçamento</button>`;
  if(!lista.length){
    h += `<div class="vazio" style="margin-top:14px"><strong>Nenhum orçamento ainda</strong>
      Monte clicando nos serviços da sua tabela. O app calcula o total e gera o PDF para você compartilhar ou baixar.</div>`;
    return h;
  }
  h += `<div class="grupo">Todos</div>` + lista.map(o=>{
    const c = cliente(o.clienteId);
    const classe = o.status==="aprovado"?"ok":o.status==="recusado"?"vencida":o.status==="enviado"?"vencendo":"neutra";
    return `<button class="linha ${classe}" data-orc="${o.id}">
      <span class="val">${brl(totalOrc(o))}</span>
      <div class="est">${esc(o.status)}</div>
      <div class="tit">${esc(c?c.nome:"Cliente removido")}</div>
      <div class="sub">${fmt(o.criado)} · vale até ${fmt(o.validade)}</div>
    </button>`;
  }).join("");
  return h;
}

function vOrcamento(){
  const o = db.orcamentos.find(x=>x.id===parametro);
  if(!o){ vista="orcar"; return vOrcamentos(); }
  const c = cliente(o.clienteId);
  const soma = o.itens.reduce((s,i)=>s+i.preco*i.qtd,0);

  let h = `<button class="btn sec mini" style="margin:0 0 14px" data-ir="orcar">Voltar</button>
  <div class="ficha">
    <div class="nome">${esc(c?c.nome:"Cliente removido")}</div>
    <div class="dado">Criado em ${fmt(o.criado)} · vale até ${fmt(o.validade)}</div>
    <div class="dado">Situação: ${esc(o.status)}</div>
  </div>
  <div class="ficha">`;

  h += o.itens.map((i,idx)=>`
    <div class="item">
      <div class="qtd">
        <button data-qtd="${o.id}|${idx}|-1" aria-label="Diminuir">−</button>
        <span>${i.qtd}</span>
        <button data-qtd="${o.id}|${idx}|1" aria-label="Aumentar">+</button>
      </div>
      <div class="n">${esc(i.nome)}<br><span style="color:var(--muted);font-size:13px">${brl(i.preco)} cada</span></div>
      <div class="p">${brl(i.preco*i.qtd)}</div>
    </div>`).join("") || `<div class="vazio">Nenhum item.</div>`;

  if(o.desconto) h += `<div class="item"><div class="n">Desconto</div><div class="p" style="color:var(--red)">− ${brl(o.desconto)}</div></div>`;
  h += `<div class="total"><span>Total</span><span>${brl(soma-(o.desconto||0))}</span></div></div>`;

  h += `<button class="btn sec" data-add-item="${o.id}">Adicionar serviço</button>
  <button class="btn sec mini" data-desconto="${o.id}">Aplicar desconto</button>`;

  h += `<button class="btn" data-compartilhar="${o.id}">Compartilhar</button>`;
  h += `<div class="grupo">Situação</div><div class="dupla">
    <button class="btn sec mini" style="margin:0" data-status="${o.id}|enviado">Marcar enviado</button>
    <button class="btn sec mini" style="margin:0" data-status="${o.id}|aprovado">Marcar aprovado</button></div>
    <button class="btn sec mini" data-status="${o.id}|recusado">Marcar recusado</button>`;
  if(o.status==="aprovado") h += `<button class="btn cobre" data-agendar-orc="${o.id}">Agendar este serviço</button>`;
  h += `<button class="btn perigo" data-apagar-orc="${o.id}">Apagar orçamento</button>`;
  return h;
}

/* ===== AGENDA ===== */
function vAgenda(){
  const hoje = hojeISO();
  const futuros = db.agendamentos.filter(a=>a.data>=hoje).sort((a,b)=>(a.data+(a.hora||"")).localeCompare(b.data+(b.hora||"")));
  const passados = db.agendamentos.filter(a=>a.data<hoje).sort((a,b)=>b.data.localeCompare(a.data));

  let h = `<div class="cabeca"><h2>Agenda</h2><p>${futuros.length} ${futuros.length===1?"serviço marcado":"serviços marcados"}</p></div>
    <button class="btn" data-novo-agend>Novo agendamento</button>`;

  if(!futuros.length){
    h += `<div class="vazio" style="margin-top:14px">Nada marcado daqui para frente.</div>`;
  }else{
    let diaAtual = "";
    futuros.forEach(a=>{
      if(a.data!==diaAtual){ diaAtual=a.data; h += `<div class="grupo">${a.data===hoje?"Hoje":fmtLongo(a.data)}</div>`; }
      const c = cliente(a.clienteId);
      const classe = a.status==="executado"?"ok":a.status==="cancelado"?"neutra":"";
      h += `<button class="linha ${classe}" data-agend="${a.id}">
        <div class="est">${esc(a.hora||"sem hora")} · ${esc(a.status)}</div>
        <div class="tit">${esc(a.tipo||"Serviço")}</div>
        <div class="sub">${esc(c?c.nome:"Cliente removido")}${a.local?" · "+esc(a.local):""}</div>
      </button>`;
    });
  }
  if(passados.length){
    h += `<div class="grupo">Anteriores</div>` + passados.slice(0,12).map(a=>{
      const c = cliente(a.clienteId);
      return `<button class="linha neutra" data-agend="${a.id}">
        <div class="est">${fmt(a.data)} · ${esc(a.status)}</div>
        <div class="tit">${esc(a.tipo||"Serviço")}</div>
        <div class="sub">${esc(c?c.nome:"Cliente removido")}</div></button>`;
    }).join("");
  }
  return h;
}

/* ---------- gerador de PDF ---------- */
const LARG = {" ":278,"R":722,"$":556,",":278,".":278,"-":333,"x":500,
  "0":556,"1":556,"2":556,"3":556,"4":556,"5":556,"6":556,"7":556,"8":556,"9":556};

function limpa(t){
  return String(t??"")
    .replace(/[\u2014\u2013\u2212]/g,"-").replace(/[\u201C\u201D]/g,'"')
    .replace(/[\u2018\u2019]/g,"'").replace(/\u2026/g,"...")
    .split("").map(c=>c.charCodeAt(0)<256?c:"?").join("");
}
const escapaPdf = t => t.replace(/([\\()])/g,"\\$1");
function larguraTexto(t, tam){
  let x = 0; for(const c of t) x += (LARG[c]||500);
  return x*tam/1000;
}

function montarPDF(fluxo){
  const objs = {
    1:"<< /Type /Catalog /Pages 2 0 R >>",
    2:"<< /Type /Pages /Kids [3 0 R] /Count 1 >>",
    3:"<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 5 0 R /F2 6 0 R >> >> /Contents 4 0 R >>",
    4:"<< /Length "+fluxo.length+" >>\nstream\n"+fluxo+"\nendstream",
    5:"<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>",
    6:"<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>"
  };
  let pdf = "%PDF-1.4\n";
  const pos = {};
  for(let i=1;i<=6;i++){ pos[i] = pdf.length; pdf += i+" 0 obj\n"+objs[i]+"\nendobj\n"; }
  const xref = pdf.length;
  pdf += "xref\n0 7\n0000000000 65535 f \n";
  for(let i=1;i<=6;i++) pdf += String(pos[i]).padStart(10,"0")+" 00000 n \n";
  pdf += "trailer\n<< /Size 7 /Root 1 0 R >>\nstartxref\n"+xref+"\n%%EOF";
  const bytes = new Uint8Array(pdf.length);
  for(let i=0;i<pdf.length;i++) bytes[i] = pdf.charCodeAt(i) & 0xFF;
  return new Blob([bytes], {type:"application/pdf"});
}

function pdfOrcamento(o){
  const c = cliente(o.clienteId);
  const E = 56, D = 539;
  let y = 782, f = "";
  const txt = (x,tam,negrito,t) => {
    const l = limpa(t);
    f += "BT /F"+(negrito?2:1)+" "+tam+" Tf "+x+" "+y.toFixed(1)+" Td ("+escapaPdf(l)+") Tj ET\n";
  };
  const dir = (tam,negrito,t) => {
    const l = limpa(t);
    f += "BT /F"+(negrito?2:1)+" "+tam+" Tf "+(D-larguraTexto(l,tam)).toFixed(1)+" "+y.toFixed(1)+" Td ("+escapaPdf(l)+") Tj ET\n";
  };
  const regua = (esp,tom) => { f += (esp||0.6)+" w "+(tom||"0.6 0.6 0.6")+" RG "+E+" "+y.toFixed(1)+" m "+D+" "+y.toFixed(1)+" l S\n"; };

  txt(E, 20, true, db.config.empresa || "Orçamento");
  if(db.config.telefone){ y -= 15; txt(E, 10, false, db.config.telefone); }
  y -= 14; regua(1.4, "0.04 0.43 0.46");

  y -= 26; txt(E, 13, true, "Orçamento");
  y -= 19; txt(E, 11, false, "Cliente: " + (c ? c.nome : "-"));
  if(c && c.telefone){ y -= 15; txt(E, 11, false, "Telefone: " + c.telefone); }
  if(c && c.endereco){ y -= 15; txt(E, 11, false, "Endereço: " + c.endereco); }
  y -= 15; txt(E, 11, false, "Data: " + fmt(o.criado));
  y -= 15; txt(E, 11, false, "Válido até: " + fmt(o.validade));

  y -= 22; regua();
  y -= 16; txt(E, 9, true, "SERVIÇO"); dir(9, true, "VALOR");
  y -= 8; regua(0.4, "0.8 0.8 0.8");

  o.itens.forEach(i => {
    if(y < 150) return;
    y -= 19;
    let nome = i.nome; if(nome.length > 48) nome = nome.slice(0,47) + "...";
    txt(E, 11, false, i.qtd + "x  " + nome);
    dir(11, false, brl(i.preco * i.qtd));
    y -= 5; regua(0.3, "0.86 0.86 0.86");
  });

  if(o.desconto){ y -= 19; txt(E, 11, false, "Desconto"); dir(11, false, "- " + brl(o.desconto)); }

  y -= 12; regua(1.2, "0.1 0.1 0.1");
  y -= 22; txt(E, 15, true, "TOTAL"); dir(15, true, brl(totalOrc(o)));

  y = 118; regua(0.6, "0.5 0.5 0.5");
  y -= 14; txt(E, 9, false, "Assinatura do cliente");
  y = 66; txt(E, 8, false, "Documento gerado pelo Ar em Dia em " + fmt(hojeISO()));

  return montarPDF(f);
}

async function compartilharOrc(id){
  const o = db.orcamentos.find(x => x.id === id);
  if(!o) return;
  if(!o.itens.length){ toast("Adicione ao menos um serviço."); return; }
  const c = cliente(o.clienteId);
  const apelido = limpa(c ? c.nome : "cliente").replace(/[^A-Za-z0-9]+/g,"-").replace(/^-|-$/g,"");
  const nomeArq = "Orcamento-" + apelido + "-" + o.criado + ".pdf";
  let blob;
  try{ blob = pdfOrcamento(o); }
  catch(e){ toast("Não consegui gerar o PDF: " + e.message); return; }

  try{
    const arq = new File([blob], nomeArq, {type:"application/pdf"});
    if(navigator.canShare && navigator.canShare({files:[arq]})){
      await navigator.share({files:[arq], title:"Orçamento"});
      return;
    }
  }catch(e){
    if(e && e.name === "AbortError") return;
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = nomeArq;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast("PDF baixado.");
}

/* ---------- eventos ---------- */
document.addEventListener("input", e=>{
  if(e.target.id==="inpBusca"){
    buscaTxt = e.target.value;
    const pos = e.target.selectionStart;
    render();
    const n = document.getElementById("inpBusca");
    if(n){ n.focus(); n.setSelectionRange(pos,pos); }
  }
});

document.addEventListener("click", e=>{
  const b = e.target.closest("[data-aba],[data-ir],[data-cliente],[data-novo-cliente],[data-edit-cliente],[data-salvar-cliente],[data-apagar-cliente],[data-novo-equip],[data-equip],[data-edit-equip],[data-salvar-equip],[data-apagar-equip],[data-fez-manut],[data-manut],[data-novo-orc],[data-criar-orc],[data-orc],[data-add-item],[data-pick],[data-qtd],[data-desconto],[data-status],[data-apagar-orc],[data-compartilhar],[data-agendar-orc],[data-novo-agend],[data-salvar-agend],[data-agend],[data-agend-status],[data-apagar-agend],[data-salvar-config],[data-serv],[data-novo-serv],[data-salvar-serv],[data-apagar-serv],[data-exportar],[data-importar],[data-zerar],[data-exemplos],[data-fechar]");
  if(!b) return;
  const d = b.dataset;

  if("fechar" in d){ fechar(); return; }
  if(d.aba){ nav(d.aba); return; }
  if(d.ir){ fechar(); nav(d.ir); return; }

  /* clientes */
  if("novoCliente" in d){ formCliente(); return; }
  if(d.cliente){ nav("cliente", d.cliente); return; }
  if(d.editCliente){ formCliente(d.editCliente); return; }
  if("salvarCliente" in d){
    const nome = document.getElementById("fNome").value.trim();
    const tel = document.getElementById("fTel").value.trim();
    if(!nome){ toast("O nome é obrigatório."); return; }
    const dados = {nome, telefone:tel,
      endereco:document.getElementById("fEnd").value.trim(),
      referencia:document.getElementById("fRef").value.trim(),
      indicado:document.getElementById("fInd").value.trim(),
      obs:document.getElementById("fObs").value.trim()};
    if(d.salvarCliente){ Object.assign(cliente(d.salvarCliente), dados); }
    else { const id=uid(); db.clientes.push({id, ...dados, criado:hojeISO()}); parametro=id; vista="cliente"; }
    salvar(); fechar(); render(); toast("Cliente salvo.");
    return;
  }
  if(d.apagarCliente){
    if(!confirm("Apagar este cliente, seus aparelhos e orçamentos?")) return;
    db.equipamentos = db.equipamentos.filter(x=>x.clienteId!==d.apagarCliente);
    db.orcamentos = db.orcamentos.filter(x=>x.clienteId!==d.apagarCliente);
    db.agendamentos = db.agendamentos.filter(x=>x.clienteId!==d.apagarCliente);
    db.historico = db.historico.filter(x=>x.clienteId!==d.apagarCliente);
    db.clientes = db.clientes.filter(x=>x.id!==d.apagarCliente);
    salvar(); nav("clientes"); toast("Cliente apagado.");
    return;
  }

  /* equipamentos */
  if(d.novoEquip){ formEquip(d.novoEquip); return; }
  if(d.equip || d.manut){ verEquip(d.equip||d.manut); return; }
  if(d.editEquip){ const [ci,ei]=d.editEquip.split("|"); formEquip(ci,ei); return; }
  if("salvarEquip" in d){
    const [clienteId, equipId] = d.salvarEquip.split("|");
    const inst = document.getElementById("eInst").value || hojeISO();
    const intervalo = Math.max(1, Number(document.getElementById("eInt").value)||db.config.intervaloPadrao);
    const dados = {
      clienteId, instalacao:inst, intervalo,
      local:document.getElementById("eLocal").value.trim(),
      marca:document.getElementById("eMarca").value.trim(),
      modelo:document.getElementById("eModelo").value.trim(),
      btu:document.getElementById("eBtu").value.trim(),
      garantiaAte: somaDias(inst, db.config.garantiaDias)
    };
    if(equipId){
      const ex = equip(equipId);
      Object.assign(ex, dados);
      ex.ultima = ex.ultima || inst;
      ex.proxima = somaMeses(ex.ultima, intervalo);
    }else{
      db.equipamentos.push({id:uid(), ...dados, ultima:inst, proxima:somaMeses(inst,intervalo)});
      db.historico.push({id:uid(), clienteId, data:inst, tipo:"Instalação", obs:dados.local});
    }
    salvar(); fechar(); render(); toast("Aparelho salvo.");
    return;
  }
  if(d.apagarEquip){
    if(!confirm("Apagar este aparelho?")) return;
    db.equipamentos = db.equipamentos.filter(x=>x.id!==d.apagarEquip);
    salvar(); fechar(); render(); toast("Aparelho apagado.");
    return;
  }
  if(d.fezManut){
    const ex = equip(d.fezManut);
    ex.ultima = hojeISO();
    ex.proxima = somaMeses(ex.ultima, ex.intervalo);
    db.historico.push({id:uid(), clienteId:ex.clienteId, data:hojeISO(), tipo:"Manutenção", obs:ex.local||""});
    salvar(); fechar(); render(); toast("Registrada. Próxima em "+fmt(ex.proxima));
    return;
  }

  /* orçamentos */
  if("novoOrc" in d){ novoOrcamento(); return; }
  if("criarOrc" in d){
    const dd = Math.max(1, Number(document.getElementById("oVal").value)||15);
    const o = {id:uid(), clienteId:document.getElementById("oCli").value, itens:[], desconto:0,
               status:"rascunho", criado:hojeISO(), validade:somaDias(hojeISO(), dd)};
    db.orcamentos.push(o); salvar(); fechar(); nav("orcamento", o.id); escolherServico(o.id);
    return;
  }
  if(d.orc){ nav("orcamento", d.orc); return; }
  if(d.addItem){ escolherServico(d.addItem); return; }
  if(d.pick){
    const [oid,sid] = d.pick.split("|");
    const o = db.orcamentos.find(x=>x.id===oid);
    const s = db.servicos.find(x=>x.id===sid);
    const ja = o.itens.find(i=>i.servicoId===sid);
    if(ja) ja.qtd++; else o.itens.push({servicoId:sid, nome:s.nome, preco:s.preco, qtd:1});
    salvar(); render(); toast(s.nome+" adicionado.");
    return;
  }
  if(d.qtd){
    const [oid, idx, delta] = d.qtd.split("|");
    const o = db.orcamentos.find(x=>x.id===oid);
    o.itens[idx].qtd += Number(delta);
    if(o.itens[idx].qtd <= 0) o.itens.splice(idx,1);
    salvar(); render();
    return;
  }
  if(d.desconto){
    const o = db.orcamentos.find(x=>x.id===d.desconto);
    const v = prompt("Valor do desconto em reais:", o.desconto||0);
    if(v===null) return;
    o.desconto = Math.max(0, Number(String(v).replace(",","."))||0);
    salvar(); render();
    return;
  }
  if(d.status){
    const [oid, st] = d.status.split("|");
    db.orcamentos.find(x=>x.id===oid).status = st;
    salvar(); render(); toast("Marcado como "+st+".");
    return;
  }
  if(d.apagarOrc){
    if(!confirm("Apagar este orçamento?")) return;
    db.orcamentos = db.orcamentos.filter(x=>x.id!==d.apagarOrc);
    salvar(); nav("orcar"); toast("Orçamento apagado.");
    return;
  }
  if(d.compartilhar){ compartilharOrc(d.compartilhar); return; }
  if(d.agendarOrc){
    const o = db.orcamentos.find(x=>x.id===d.agendarOrc);
    formAgend({clienteId:o.clienteId, tipo:o.itens.map(i=>i.nome)[0]||"Serviço"});
    return;
  }

  /* agenda */
  if("novoAgend" in d){ formAgend(); return; }
  if("salvarAgend" in d){
    const a = {id:uid(), clienteId:document.getElementById("gCli").value,
      tipo:document.getElementById("gTipo").value.trim()||"Serviço",
      data:document.getElementById("gData").value||hojeISO(),
      hora:document.getElementById("gHora").value,
      obs:document.getElementById("gObs").value.trim(), status:"agendado"};
    db.agendamentos.push(a); salvar(); fechar(); nav("agenda"); toast("Agendado.");
    return;
  }
  if(d.agend){ verAgend(d.agend); return; }
  if(d.agendStatus){
    const [id, st] = d.agendStatus.split("|");
    const a = db.agendamentos.find(x=>x.id===id);
    a.status = st;
    if(st==="executado") db.historico.push({id:uid(), clienteId:a.clienteId, data:a.data, tipo:a.tipo, obs:a.obs||""});
    salvar(); fechar(); render(); toast("Atualizado.");
    return;
  }
  if(d.apagarAgend){
    if(!confirm("Apagar este agendamento?")) return;
    db.agendamentos = db.agendamentos.filter(x=>x.id!==d.apagarAgend);
    salvar(); fechar(); render(); toast("Apagado.");
    return;
  }

  /* ajustes */
  if("salvarConfig" in d){
    db.config.empresa = document.getElementById("aEmp").value.trim();
    db.config.telefone = document.getElementById("aTel").value.trim();
    db.config.intervaloPadrao = Math.max(1, Number(document.getElementById("aInt").value)||6);
    db.config.garantiaDias = Math.max(0, Number(document.getElementById("aGar").value)||90);
    salvar(); toast("Ajustes salvos.");
    return;
  }
  if(d.serv){ formServico(d.serv); return; }
  if("novoServ" in d){ formServico(); return; }
  if("salvarServ" in d){
    const nome = document.getElementById("sNome").value.trim();
    if(!nome){ toast("Dê um nome ao serviço."); return; }
    const preco = Number(String(document.getElementById("sPreco").value).replace(",","."))||0;
    const dur = Number(document.getElementById("sDur").value)||0;
    if(d.salvarServ) Object.assign(db.servicos.find(x=>x.id===d.salvarServ), {nome,preco,dur});
    else db.servicos.push({id:uid(), nome, preco, dur});
    salvar(); fechar(); render(); toast("Serviço salvo.");
    return;
  }
  if(d.apagarServ){
    db.servicos = db.servicos.filter(x=>x.id!==d.apagarServ);
    salvar(); fechar(); render(); toast("Serviço apagado.");
    return;
  }
  if("exportar" in d){
    const blob = new Blob([JSON.stringify(db,null,2)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "ar-em-dia-"+hojeISO()+".json";
    a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 1500);
    toast("Backup baixado.");
    return;
  }
  if("importar" in d){ document.getElementById("arqImport").click(); return; }
  if("exemplos" in d){
    if(db.clientes.length && !confirm("Isso adiciona clientes de exemplo. Continuar?")) return;
    semear(); salvar(); nav("hoje"); toast("Exemplos carregados.");
    return;
  }
  if("zerar" in d){
    if(!confirm("Apagar TODOS os dados deste aparelho? Não tem volta.")) return;
    if(!confirm("Tem certeza mesmo? Baixe um backup antes.")) return;
    db = JSON.parse(JSON.stringify(PADRAO)); salvar(); nav("hoje"); toast("Tudo apagado.");
    return;
  }
});

document.getElementById("arqImport").addEventListener("change", ev=>{
  const f = ev.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const novo = JSON.parse(r.result);
      if(!novo.clientes) throw new Error("formato");
      if(!confirm("Restaurar o backup substitui todos os dados atuais. Continuar?")) return;
      db = novo;
      for(const k in PADRAO) if(!(k in db)) db[k] = JSON.parse(JSON.stringify(PADRAO[k]));
      salvar(); aplicarTema(); nav("hoje"); toast("Backup restaurado.");
    }catch(e){ toast("Arquivo inválido. Use um backup do Ar em Dia."); }
  };
  r.readAsText(f);
  ev.target.value = "";
});
